services:
  db:
    image: postgres:16-alpine
    # No published port: Postgres is only reachable on the internal compose
    # network. Use `docker compose exec db psql ...` for administrative access.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blessp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-blessp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blessp} -d ${POSTGRES_DB:-blessp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # No published port: Redis stays internal to the compose network.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Vite inlines these into the client bundle at build time; they are
      # public client-side values, not secrets.
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:?Set VITE_STRIPE_PUBLISHABLE_KEY in your .env file}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_APPLE_CLIENT_ID: ${VITE_APPLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-blessp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blessp}
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:-}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      CLIENT_URL: ${CLIENT_URL:?Set the public HTTPS storefront URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set allowed HTTPS origins}
      TRUST_PROXY: ${TRUST_PROXY:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set a persistent independent 32-byte base64 key}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a metrics bearer token of 32 characters or more}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      # Transactional email is mandatory in production (env validation refuses
      # to boot without EMAIL_FROM and at least one provider key).
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in your .env file}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Set the real support mailbox}
      SHIPPING_RATES_JSON: ${SHIPPING_RATES_JSON:?Set explicitly approved country shipping rates}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
      # Consumed by the compiled database seed (`node prisma/seed.js`), which refuses to
      # create the production admin account without them.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: info
      SERVICE_NAME: blessp-api
      SERVICE_VERSION: 3.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
