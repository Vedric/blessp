services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blessp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-blessp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blessp} -d ${POSTGRES_DB:-blessp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: node:22-alpine
    working_dir: /app/server
    command: sh -c "npm install && npx prisma generate && npx prisma db push --skip-generate && npx tsx prisma/seed.ts && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-blessp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blessp}
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:-}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LOG_LEVEL: debug
      SERVICE_NAME: blessp-api
      SERVICE_VERSION: 3.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    image: node:22-alpine
    working_dir: /app/client
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
      VITE_STRIPE_PUBLIC_KEY: pk_test_placeholder
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
  server_node_modules:
  client_node_modules:
