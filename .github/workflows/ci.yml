# Continuous Integration Pipeline
# Validates code quality, runs tests, and verifies builds on every PR and push.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        workspace: [server, client]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ matrix.workspace }} && npm ci

      - name: Generate Prisma client
        if: matrix.workspace == 'server'
        run: cd server && npx prisma generate

      - name: Lint
        run: cd ${{ matrix.workspace }} && npm run lint

      - name: TypeScript check
        run: cd ${{ matrix.workspace }} && npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      STRIPE_SECRET_KEY: sk_test_fake_key_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_fake_key_for_ci
      CLIENT_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Generate RSA keypair for JWT tests
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -outform PEM -out /tmp/jwt_private.pem 2>/dev/null
          openssl pkey -in /tmp/jwt_private.pem -pubout -out /tmp/jwt_public.pem 2>/dev/null
          echo "JWT_PRIVATE_KEY_BASE64=$(cat /tmp/jwt_private.pem | base64 -w0)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$(cat /tmp/jwt_public.pem | base64 -w0)" >> "$GITHUB_ENV"
          rm /tmp/jwt_private.pem /tmp/jwt_public.pem

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Generate Prisma client
        run: cd server && npx prisma generate

      - name: Run unit tests with coverage
        run: |
          cd server && npx jest --testPathPattern=tests/unit --coverage \
            --coverageThreshold='{"global":{"lines":80,"branches":70,"functions":75}}'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: server/coverage/
          retention-days: 14

  integration-tests:
    name: Integration Tests
    needs: lint-typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blessp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blessp_test
      STRIPE_SECRET_KEY: sk_test_fake_key_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_fake_key_for_ci
      CLIENT_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Generate RSA keypair for JWT tests
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -outform PEM -out /tmp/jwt_private.pem 2>/dev/null
          openssl pkey -in /tmp/jwt_private.pem -pubout -out /tmp/jwt_public.pem 2>/dev/null
          echo "JWT_PRIVATE_KEY_BASE64=$(cat /tmp/jwt_private.pem | base64 -w0)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$(cat /tmp/jwt_public.pem | base64 -w0)" >> "$GITHUB_ENV"
          rm /tmp/jwt_private.pem /tmp/jwt_public.pem

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Generate Prisma client
        run: cd server && npx prisma generate

      - name: Push database schema
        run: cd server && npx prisma db push --skip-generate

      - name: Run integration tests
        run: cd server && npx jest --testPathPattern=tests/integration --passWithNoTests

  build:
    name: Build Artifacts
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Generate Prisma client
        run: cd server && npx prisma generate

      - name: Build server
        run: cd server && npm run build

      - name: Build client
        run: cd client && npm run build

      - name: Upload server build artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist/
          retention-days: 7

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7

  docker-build:
    name: Docker Build & Security Scan
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: blessp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: blessp:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  e2e-tests:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blessp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blessp_test
      STRIPE_SECRET_KEY: sk_test_fake_key_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_fake_key_for_ci
      CLIENT_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Generate RSA keypair for JWT
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -outform PEM -out /tmp/jwt_private.pem 2>/dev/null
          openssl pkey -in /tmp/jwt_private.pem -pubout -out /tmp/jwt_public.pem 2>/dev/null
          echo "JWT_PRIVATE_KEY_BASE64=$(cat /tmp/jwt_private.pem | base64 -w0)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$(cat /tmp/jwt_public.pem | base64 -w0)" >> "$GITHUB_ENV"
          rm /tmp/jwt_private.pem /tmp/jwt_public.pem

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Generate Prisma client
        run: cd server && npx prisma generate

      - name: Push database schema
        run: cd server && npx prisma db push --skip-generate

      - name: Install Playwright browsers
        run: cd client && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd client && npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Audit server dependencies
        run: cd server && npm audit --audit-level=high

      - name: Audit client dependencies
        run: cd client && npm audit --audit-level=high

      - name: Validate Prisma schema
        run: cd server && npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
