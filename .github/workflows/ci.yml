name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Lint, types, migrations and server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blessp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/blessp_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/blessp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci && npm --prefix server ci && npm --prefix client ci
      - run: npm --prefix server run db:generate
      - run: npm run lint
      - run: npm run build:test
      - run: node scripts/test-env.cjs node scripts/verify-legacy-migration.cjs
      # All source files count. Real integration tests supplement unit coverage.
      - run: node scripts/test-env.cjs npm --prefix server run test:coverage -- --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14
  browsers:
    name: Browser journeys (${{ matrix.browser }}, ${{ matrix.partition }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            partition: 1
            total: 1
            workers: 2
          - browser: firefox
            partition: 1
            total: 1
            workers: 2
          # WebKit gets a dedicated runner per worker for its heavier UI checks.
          - browser: webkit
            partition: 1
            total: 2
            workers: 1
          - browser: webkit
            partition: 2
            total: 2
            workers: 1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blessp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      E2E_CROSS_BROWSER: '1'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/blessp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci && npm --prefix server ci && npm --prefix client ci
      - run: npm --prefix server run db:generate
      - run: npm run build:test
      - run: cd client && npx --no-install playwright install --with-deps "${{ matrix.browser }}"
      # Each browser has its own database and application process.
      - run: node scripts/test-env.cjs npm --prefix client run test:e2e -- --project="${{ matrix.browser }}" --shard="${{ matrix.partition }}/${{ matrix.total }}" --workers="${{ matrix.workers }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}-${{ matrix.partition }}
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 14
  providers:
    name: Payment and social sign-in provider contracts (three browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blessp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/blessp_test
      E2E_SIMULATE_PROVIDERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci && npm --prefix server ci && npm --prefix client ci
      - run: npm --prefix server run db:generate
      # Synthetic public OAuth IDs only; never inherit provider credentials.
      - run: node scripts/build-e2e.cjs --providers
      - run: cd client && npx --no-install playwright install --with-deps chromium firefox webkit
      - run: node scripts/test-env.cjs npm --prefix client run test:e2e -- --config playwright.providers.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-contract-results
          path: |
            client/playwright-report-providers/
            client/test-results-providers/
          retention-days: 14
  security:
    name: Audit all dependency trees
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm audit --audit-level=high
      - run: npm --prefix server audit --audit-level=high
      - run: npm --prefix client audit --audit-level=high
  docker:
    name: Production image build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: blessp:${{ github.sha }}
          build-args: |
            VITE_STRIPE_PUBLISHABLE_KEY=pk_test_ci_placeholder
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check runtime tools and non-root execution
        run: |
          test "$(docker run --rm --entrypoint id "blessp:$GITHUB_SHA" -u)" != 0
          docker run --rm "blessp:$GITHUB_SHA" node_modules/prisma/build/index.js --version
          docker run --rm "blessp:$GITHUB_SHA" -e "for (const p of ['jest','eslint','tsx']) { try { require.resolve(p); process.exit(1); } catch(e) { if (e.code !== 'MODULE_NOT_FOUND') throw e; } }"
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: blessp:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
