name: Resilience
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 2'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/load-commerce.cjs'
      - 'scripts/test-env.cjs'
      - '.github/workflows/resilience.yml'
permissions:
  contents: read
concurrency:
  group: resilience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resilience:
    name: Repeated server suites and commerce load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blessp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/blessp_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/blessp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run db:generate
      - run: npm --prefix server run build
      - name: Repeat complete suites with reproducible test ordering
        run: |
          set -euo pipefail
          mkdir -p artifacts/resilience-ci
          for seed in 260926 260927 260928; do
            node scripts/test-env.cjs npm --prefix server run test:all -- --maxWorkers=2 --randomize --seed="$seed" --showSeed 2>&1 | tee "artifacts/resilience-ci/server-$seed.log"
          done
      - name: Load catalogue, retry orders and check stock conservation
        run: node scripts/test-env.cjs node scripts/load-commerce.cjs artifacts/resilience-ci/load.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resilience-results
          path: artifacts/resilience-ci/
          retention-days: 14
