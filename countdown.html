<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Countdown</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: rgb(0, 0, 0);
    }
    #countdown {
        font-size: 2em;
        font-weight: bold;
        color: #333;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        display: inline-block;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1{
    	color:silver;
    }
</style>
</head>
<body>
<img src="/img/logo_blessp_blk.jpg" >
<h1>Opening in ...</h1>
<div id="countdown">Loading...</div>
<!-- <div ><a href="/home.php">Home</a></div> -->

<script>
// Définir la date cible (AAAA, MM-1, JJ, HH, MM, SS)
// Exemple : 1 mars 2026 à 12:00:00
const targetDate = new Date(2026, 2, 15, 0, 0, 0).getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    // Si le compte à rebours est terminé
    if (distance <= 0) {
        
        clearInterval(timer);
        location = "/home.php"
        return;
    }

    // Calcul du temps restant
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    // Affichage formaté
    document.getElementById("countdown").innerHTML =
        `${days}j ${hours}h ${minutes}m ${seconds}s`;
}

// Mise à jour toutes les secondes
const timer = setInterval(updateCountdown, 1000);
updateCountdown(); // Appel initial pour éviter 1s de délai
</script>

</body>
</html>
