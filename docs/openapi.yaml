        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}/timeline:
    get:
      operationId: getOrderTimeline
      tags:
      - Orders
      summary: Retrieve the status history for an order
      description: 'Returns a chronological list of status changes for the specified order, enabling customers to
        track their order''s progression.

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Order timeline entries
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DataEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrderTimelineEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags:
      - Orders
      summary: Update the status of an order (admin only)
      description: 'Admin fulfillment transitions only: paid → confirmed → processing → shipped → delivered. Unpaid
        reservations can be cancelled through the payment cancellation route. Payment and refund states are webhook-controlled.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/paypal/create:
    post:
      operationId: createPaypalOrder
      tags: [Payments]
      summary: Create or resume a PayPal approval for a reserved order
      description: Authenticated owner or guest email required. Amount and currency come from the server order. Changing an existing provider requires cancelling the reservation first.
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaypalOrderRequest'
      responses:
        '200':
          description: Trusted HTTPS PayPal approval URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      approvalUrl:
                        type: string
                        format: uri
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /payments/paypal/capture:
    post:
      operationId: capturePaypalOrder
      tags: [Payments]
      summary: Capture an approved PayPal payment or reconcile a previous attempt
      description: Never accepts a provider ID or amount from the browser. Ambiguous results retain the stock reservation until reconciliation. Approval and redirect parameters are not proof of payment.
      security:
      - bearerAuth: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaypalOrderRequest'
      responses:
        '200':
          description: Server payment state after reconciliation; pending does not authorize fulfillment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paymentStatus:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Payment requires reconciliation
        '422':
          $ref: '#/components/responses/ValidationError'
  /payments/paypal/webhook:
    post:
      operationId: paypalWebhook
      tags: [Payments]
      security: []
      summary: Verify a PayPal event and reconcile the provider state
      description: Requires PayPal transmission-id, transmission-time, transmission-sig, auth-algo and cert-url headers. Signature is verified through PayPal using this environment's webhook ID before processing. Capture and refund amounts are fetched again from the fixed provider API origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Verified event processed or ignored
        '409':
          description: Local binding not committed yet; provider must retry
        '422':
          $ref: '#/components/responses/ValidationError'
  /payments/create-intent:
    post:
      operationId: createPaymentIntent
      tags:
      - Payments
      summary: Create a Stripe payment intent for an order
      description: 'Initiates a payment intent with Stripe for the specified order using automatic_payment_methods
        (cards, Apple Pay, Google Pay, PayPal). Returns the client secret required to confirm payment on the frontend
        via Stripe PaymentElement. Intents are always created in CAD, the store settlement currency; other currencies
        shown in the storefront are display conversions only.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentRequest'
      responses:
        '200':
          description: Payment intent created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DataEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PaymentIntent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/setup-intent:
    post:
      operationId: createSetupIntent
      tags:
      - Payments
      summary: Create a Stripe setup intent for saving a payment method
      description: 'Creates a SetupIntent with automatic_payment_methods enabled for saving a new payment method
        (card, wallet, etc.) without an immediate charge. Used by the payment methods management page.

        '
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Setup intent created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DataEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        clientSecret:
                          type: string
                          example: seti_1abc123_secret_xyz
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/guest-create-intent:
    post:
      operationId: createGuestPaymentIntent
      tags:
      - Payments
      summary: Create a payment intent for a guest order
      description: 'Issues a Stripe PaymentIntent for an order placed via POST /orders/guest. Ownership is proven
        by matching the caller''s email against Order.guestEmail. The intent has automatic payment methods enabled
        and a receipt_email so Stripe delivers a receipt to the buyer without requiring an account.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orderId
              - email
              properties:
                orderId:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Guest payment intent created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DataEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PaymentIntent'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /payments/webhook:
    post:
      operationId: handlePaymentWebhook
      tags:
      - Payments
      summary: Process incoming Stripe webhook events
      description: 'Receives and processes webhook events from Stripe. Verifies the webhook signature before processing.
        Updates order status based on payment outcomes. An order is only marked paid when the intent''s amount and
        currency match the order total in CAD; a failed payment attempt leaves the order pending so the buyer can
        retry.

        '
      parameters:
      - name: stripe-signature
        in: header
        required: true
        schema:
          type: string
        description: Stripe webhook signature for payload verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload
      responses:
        '200':
          description: Webhook processed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/methods:
    get:
      operationId: listPaymentMethods
