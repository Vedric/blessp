openapi: 3.1.0
info:
  title: BLE$$ P API
  version: 3.0.0
  description: 'RESTful API for the BLE$$ P luxury streetwear e-commerce platform. Provides endpoints for product
    catalog browsing, user authentication, order management, payment processing, and administrative operations.

    '
  contact:
    name: Engineering Team
servers:
- url: /api/v1
  description: Version 1 API
tags:
- name: Auth
  description: Authentication, registration, and session management
- name: Users
  description: User profile and account management
- name: Products
  description: Product catalog browsing and administration
- name: Cart
  description: Shopping cart operations
- name: Orders
  description: Order placement and lifecycle management
- name: Payments
  description: Payment processing via Stripe PaymentElement (cards, Apple Pay, Google Pay, PayPal)
- name: Wishlist
  description: Product wishlist management
- name: Coupons
  description: Coupon validation, application, and administration
- name: Currency
  description: Currency exchange rates
- name: Reviews
  description: Product reviews and ratings
- name: Newsletter
  description: Newsletter subscription management
- name: Loyalty
  description: Loyalty points, tiers, and redemption
- name: Analytics
  description: Administrative dashboard analytics
- name: Contact
  description: Public contact form submissions
- name: Health
  description: Service health and readiness probes
- name: Inventory
  description: Administrator inventory and manual adjustment history
security: []
paths:
  /auth/register:
    post:
      operationId: registerUser
      tags:
      - Auth
      summary: Register a new user account
      description: Creates an unverified account and queues an email confirmation. Always returns the same 202 response
        for existing and new email addresses. No credentials are issued before verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Check your email to continue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /auth/login:
    post:
      operationId: loginUser
      tags:
      - Auth
      summary: Authenticate with email and password
      description: Requires a verified email address, password and, when enabled, mfaToken. MFA_REQUIRED and INVALID_MFA_CODE
        are 401 responses. Refresh credentials are sent in an HttpOnly cookie; only access credentials can authorize
        business routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      operationId: refreshTokens
      tags:
      - Auth
      summary: Rotate the refresh token and issue a new token pair
      description: 'Consumes the provided refresh token, invalidates it, and returns a new access/refresh token
        pair. Detects token reuse and revokes the entire token family when reuse is identified. Rate limited to
        10 requests per 15 minutes per IP address.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logoutUser
      tags:
      - Auth
      summary: Revoke a refresh token and end the session
      description: 'Invalidates the provided refresh token so it can no longer be used to obtain new access tokens.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session terminated successfully
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags:
      - Auth
      summary: Request a password reset email
      description: 'Sends a password reset link to the provided email address if an account exists. Always returns
        a success response regardless of whether the email is registered to prevent user enumeration. Rate limited
        to 10 requests per 15 minutes per IP address.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset instructions sent (if account exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags:
      - Auth
      summary: Set a new password using a reset token
      description: 'Validates the password reset token and updates the user''s password. The token is single-use
        and expires after a configured time window. Rate limited to 10 requests per 15 minutes per IP address.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
      - Auth
      summary: Retrieve the authenticated user's profile
      description: 'Returns the profile of the currently authenticated user based on the Bearer token provided in
        the Authorization header.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/google:
    post:
      operationId: signInWithGoogle
      tags:
      - Auth
      summary: Sign in or register with Google
      description: 'Authenticates a user via a Google ID token. If the Google account is not yet linked to an existing
        user, a new account is created automatically. Returns the user profile and an access token. Rate limited
        to 10 requests per 15 minutes per IP address.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/apple:
    post:
      operationId: signInWithApple
      tags:
      - Auth
      summary: Sign in or register with Apple
      description: 'Authenticates a user via an Apple ID token. If the Apple account is not yet linked to an existing
        user, a new account is created automatically. The optional firstName and lastName fields are provided by
        Apple only on the first sign-in and should be forwarded by the client. Rate limited to 10 requests per 15
        minutes per IP address.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleOAuthRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/profile:
    get:
      operationId: getUserProfile
      tags:
      - Users
      summary: Retrieve the authenticated user's full profile
      description: 'Returns the full profile of the currently authenticated user, including timestamps.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateUserProfile
      tags:
      - Users
      summary: Update the authenticated user's profile
      description: 'Partially updates the authenticated user''s profile fields. Only the provided fields are modified.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/change-password:
    post:
      operationId: changeUserPassword
      tags:
      - Users
      summary: Change the authenticated user's password
      description: 'Verifies the current password and updates it to the new value. Requires the user to provide
        their existing password for confirmation.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/account:
    delete:
      operationId: deleteUserAccount
      tags:
      - Users
      summary: Permanently delete the authenticated user's account (GDPR)
      description: 'Permanently removes the authenticated user''s account and all associated personal data in compliance
        with GDPR right-to-erasure requirements. The user must confirm the action by providing their current password.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
              description: Password is required for password accounts; social-login accounts require an enabled
                MFA factor and a valid mfaToken.
      responses:
        '204':
          description: Account deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/email-preferences:
    get:
      operationId: getEmailPreferences
      tags:
      - Users
      summary: Retrieve the authenticated user's email preferences
      description: 'Returns the current email notification preferences for the authenticated user, covering order
        updates, promotions, newsletter, and loyalty alerts.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Email preferences retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateEmailPreferences
      tags:
      - Users
      summary: Update the authenticated user's email preferences
      description: 'Partially updates the email notification preferences for the authenticated user. Only the provided
        fields are modified.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailPreferencesRequest'
      responses:
        '200':
          description: Email preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /products:
    get:
      operationId: listProducts
      tags:
      - Products
      summary: List products with filtering, sorting, and pagination
      description: 'Returns a paginated list of products. Supports filtering by category, price range, colors, sizes,
        and active status. Supports full-text search and configurable sort order.

        '
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      - name: category
        in: query
        schema:
          type: string
          maxLength: 100
        description: Filter by product category
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
        description: Full-text search across product name and description
      - name: sort
        in: query
        schema:
          type: string
          maxLength: 100
        description: Sort expression (e.g. "price:asc", "createdAt:desc")
      - name: isActive
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Filter by active status
      - name: minPrice
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
        description: Minimum price filter (in cents)
      - name: maxPrice
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
        description: Maximum price filter (in cents)
      - name: colors
        in: query
        schema:
          type: string
          maxLength: 500
        description: Comma-separated list of color values to filter by
      - name: sizes
        in: query
        schema:
          type: string
          maxLength: 200
        description: Comma-separated list of size values to filter by
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProduct
      tags:
      - Products
      summary: Create a new product (admin only)
      description: 'Adds a new product to the catalog. Requires administrator privileges. Price is specified in
        cents as a positive integer.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags:
      - Products
      summary: List featured products for the storefront
      description: 'Returns products that have been assigned a front-page display order, sorted by their onfrontOrder
        value. Used for the homepage showcase.

        '
      responses:
        '200':
          description: Featured product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductArrayResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/filters:
    get:
      operationId: getProductFilters
      tags:
      - Products
      summary: Retrieve available filter options for the product catalog
      description: 'Returns the distinct categories, colors, sizes, and the overall price range across all active
        products. Used to populate filter controls on the storefront.

        '
      responses:
        '200':
          description: Available filter values
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DataEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ProductFilters'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/{id}:
    get:
      operationId: getProduct
      tags:
      - Products
      summary: Retrieve a single product by ID
      description: 'Returns the full product details including images, category, available colors, sizes, and stock
        information.

        '
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDataResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProduct
      tags:
      - Products
      summary: Partially update a product (admin only)
      description: 'Updates the specified fields of an existing product. Requires administrator privileges.

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteProduct
      tags:
      - Products
      summary: Delete a product (admin only)
      description: 'Removes a product from the catalog. Requires administrator privileges.

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Product deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/{id}/complete-look:
    get:
      operationId: getCompleteLook
      tags:
      - Products
      summary: Retrieve complementary products for a complete look
      description: 'Returns a curated set of products that pair well with the specified product, enabling "complete
        the look" styling recommendations on the product detail page.

        '
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Complementary products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductArrayResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/{id}/variants:
    get:
      operationId: getProductVariants
      tags:
      - Products
      summary: List all variants for a product
      description: 'Returns all size/color/stock combinations (variants) available for the specified product.

        '
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Product variant list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DataEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductVariant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceProductVariants
      tags:
      - Products
      summary: Adjust selected variants atomically (admin only)
      description: Upserts only supplied variants; omitted variants are retained. Existing variants require expectedStock
        from the last read. A stale or missing expectedStock returns 409 and rolls back the whole batch. Size/color
        must belong to the product (empty string when no options). Manual stock changes record the administrator
        and before/after values.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariantsRequest'
      responses:
        '200':
          description: Current product variants after adjustment
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DataEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductVariant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Missing or stale expectedStock; reload before retrying.
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /cart:
    get:
      operationId: getCart
      tags:
      - Cart
      summary: Retrieve the authenticated user's shopping cart
      description: 'Returns all items in the user''s cart, including product details, the total price in cents,
        and the item count.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: addToCart
      tags:
      - Cart
      summary: Add a product to the cart
      description: 'Adds the specified product with a given quantity, size, and color to the authenticated user''s
        shopping cart.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '201':
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: clearCart
      tags:
      - Cart
      summary: Remove all items from the cart
      description: 'Empties the authenticated user''s shopping cart entirely.

        '
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Cart cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /cart/{itemId}:
    patch:
      operationId: updateCartItem
      tags:
      - Cart
      summary: Update the quantity of a cart item
      description: 'Changes the quantity of an existing item in the authenticated user''s cart.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Cart item identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: removeCartItem
      tags:
      - Cart
      summary: Remove a single item from the cart
      description: 'Deletes a specific item from the authenticated user''s cart.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Cart item identifier
      responses:
        '204':
          description: Item removed from cart
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders:
    post:
      operationId: createOrder
      tags:
      - Orders
      summary: Place a new order from the current cart
      description: Converts the authenticated cart into an order, applying an optional coupon and reserving variant
        stock. The configured delivery destination is validated before reservation. Delivery fees and free thresholds
        are selected by country and applied after discounts; totalCents includes delivery. A replay preserves the
        amounts of the existing order.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDataResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listAllOrders
      tags:
      - Orders
      summary: List all orders (admin only)
      description: 'Returns a paginated list of all orders across all users. Supports filtering by order status.
        Requires administrator privileges.

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/OrderStatus'
        description: Filter by order status
      responses:
        '200':
          description: Paginated order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/guest:
    post:
      operationId: createGuestOrder
      tags:
      - Orders
      summary: Place an order as a guest (no account)
      description: Creates a guest order from the explicit cart, with catalogue prices recomputed server-side. The
        configured delivery rules are identical to POST /orders. Confirmation is queued after verified payment in
        the requested language. Idempotent replay preserves the existing order amounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - addressLine1
              - city
              - postalCode
              - country
              - email
              - items
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 100
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 100
                phone:
                  type: string
                  maxLength: 30
                addressLine1:
                  type: string
                  minLength: 1
                  maxLength: 200
                addressLine2:
                  type: string
                  maxLength: 200
                city:
                  type: string
                  minLength: 1
                  maxLength: 100
                postalCode:
                  type: string
                  minLength: 1
                  maxLength: 20
                province:
                  type: string
                  maxLength: 100
                country:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Must match a delivery country returned by GET /commerce/config.
                couponCode:
                  type: string
                  maxLength: 50
                billingAddress:
                  $ref: '#/components/schemas/BillingAddress'
                email:
                  type: string
                  format: email
                  maxLength: 254
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required:
                    - productId
                    - quantity
                    properties:
                      productId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 100
                      size:
                        type: string
                        maxLength: 20
                      color:
                        type: string
                        maxLength: 40
                locale:
                  type: string
                  enum: &id001
                  - en
                  - fr
                  description: Optional confirmation email language. Defaults to en when absent.
                checkoutKey:
                  type: string
                  format: uuid
                  description: Stable per-checkout retry key. Changed details with the same key return 409.
              additionalProperties: false
      responses:
        '201':
          description: Guest order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDataResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /orders/mine:
    get:
      operationId: listMyOrders
      tags:
      - Orders
      summary: List the authenticated user's orders
      description: 'Returns a paginated list of orders belonging to the authenticated user. Supports filtering by
        order status.

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/OrderStatus'
        description: Filter by order status
      responses:
        '200':
          description: Paginated order list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{id}:
    get:
      operationId: getOrder
      tags:
      - Orders
      summary: Retrieve a single order by ID
      description: 'Returns the full details of an order including line items and shipping address. Regular users
        can only access their own orders; administrators can access any order.

        '
      security:
      - bearerAuth: []
      parameters:
