          type:
          - string
          - 'null'
          format: date-time
  responses:
    BadRequest:
      description: The request is malformed or contains invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid query parameters.
              requestId: 01J3K8QV7B2XHYZT
    Unauthorized:
      description: Authentication is required or credentials are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UNAUTHORIZED
              message: Invalid email or password.
              requestId: 01J3K8QV7B2XHYZT
    Forbidden:
      description: Authenticated but insufficient permissions for this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action.
              requestId: 01J3K8QV7B2XHYZT
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: The requested resource does not exist.
              requestId: 01J3K8QV7B2XHYZT
    Conflict:
      description: The request conflicts with existing state (e.g. duplicate resource)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: CONFLICT
              message: A resource with this identifier already exists.
              requestId: 01J3K8QV7B2XHYZT
    ValidationError:
      description: Request body failed schema validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    RateLimitExceeded:
      description: Too many requests within the allowed window
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets
        RateLimit-Limit:
          schema:
            type: integer
          description: Maximum number of requests allowed in the window
        RateLimit-Remaining:
          schema:
            type: integer
          description: Number of requests remaining in the current window
        RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when the rate limit window resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Too many requests. Please wait before trying again.
              requestId: 01J3K8QV7B2XHYZT
    InternalError:
      description: An unexpected server error occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred. The team has been notified.
              requestId: 01J3K8QV7B2XHYZT
